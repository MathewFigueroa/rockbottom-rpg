name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rockbottom/shared build
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: test-results/
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rockbottom-server-ci -f server/Dockerfile .
      - run: docker build -t rockbottom-mcp-ci -f mcp/Dockerfile .
      - name: Smoke test production entrypoints
        run: |
          docker run -d --name rb-server-ci -e ADMIN_PASSWORD=ci-only-password -e ADMIN_SESSION_SECRET=ci-only-session-secret-32-characters -e CLIENT_ORIGIN=http://localhost -e SAVE_PATH=/app/data/world.json rockbottom-server-ci
          docker run -d --name rb-mcp-ci rockbottom-mcp-ci
          for service in rb-server-ci rb-mcp-ci; do
            if [ "$service" = rb-server-ci ]; then port=3000; else port=3001; fi
            docker exec "$service" node -e "(async()=>{for(let i=0;i<40;i++){try{const r=await fetch('http://127.0.0.1:$port/health');if(r.ok)process.exit(0)}catch{}await new Promise(r=>setTimeout(r,250))}process.exit(1)})()"
          done
      - name: Clean up test containers
        if: always()
        run: docker rm -f rb-server-ci rb-mcp-ci || true


  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rockbottom
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: rockbottom_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rockbottom -d rockbottom_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://rockbottom:ci-only-password@localhost:5432/rockbottom_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rockbottom/shared build
      - run: pnpm exec vitest run server/src/postgres.test.ts
